[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
thiserror = "2.0.21"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "rt", "macros", "time"] }
nix = { version = "0.32.0", features = ["signal", "process", "user", "fs"] }
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
assert_cmd = "2.2.2"
futures = "0.3.34"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
# The app's UI. gpui-kit 0.8.1 pins this exact GPUI; upgrade both together.
gpui-kit = "=0.8.1"
gpui-pre = "=0.3.10"
