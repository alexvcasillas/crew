[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
thiserror = "2.0.21"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "rt", "macros", "time"] }
nix = { version = "0.32.0", features = ["signal", "process", "user", "fs"] }
anyhow = "1.0.105"
