[package]
name = "crew-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Crew: a macOS app where coding agents work as chat members"
publish = false

[dependencies]
crew-proto = { path = "../crew-proto" }
tokio = { workspace = true, features = ["net", "rt", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui-kit = { workspace = true }
gpui-pre = { workspace = true }
nix = { workspace = true, features = ["socket"] }
serde_json = { workspace = true }

[dev-dependencies]
crewd = { path = "../crewd" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

# `test-support` for the window tests (`#[gpui_kit::test]`, element queries).
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
